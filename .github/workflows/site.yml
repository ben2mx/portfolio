name: site

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write   # the deploy step comments the preview URL on the pull request

# Actions are pinned to an exact commit so a re-tagged release cannot change what runs.
env:
  HUGO_VERSION: 0.165.0
  HUGO_SHA256: b4fab4477743c0f1fcfe85072a71156d78f97e4724f0d8bb3b1b1ff2f53ce3ac

jobs:
  build-deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 0   # full history, so the leak check sees every commit message

      - name: Leak check
        env:
          BLOCKLIST: ${{ secrets.BLOCKLIST }}
        run: scripts/check-public.sh

      - name: Install Hugo
        run: |
          curl -fsSL -o /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  /tmp/hugo.deb" | sha256sum --check
          sudo dpkg -i /tmp/hugo.deb

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: hugo --gc --minify --baseURL "$SITE_URL"

      - name: Deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: public
          skip_app_build: true

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
